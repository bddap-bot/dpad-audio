<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RUNNING</title>
</head>
<body>
<pre id="out"></pre>
<script type="module">
// DOM-level round-trip test: load index.html with a hash exercising every
// kind of new state (dpad-audio#2 — layer params, per-layer rack contents +
// order, master rack order, sidebar/panel gates), read the resulting control
// state, then reload from the hash the app itself wrote and require the
// state identical. Run via dom-test.sh (headless chromium); verdict is the
// DOM-TEST: PASS/FAIL line in the body.
const out = [];
const fail = (m) => out.push('FAIL: ' + m);

const STATE =
  '#scheme=drift&scale=insen&dev=1&fx=1' +
  '&dev-pitch=24&dev-crush=0.5' +
  '&fx-delay=1&fx-delay-wet=0.55&fx-delay-time=0.7&fx-filter-type=highpass' +
  '&fx-order=reverb,crush,filter,chorus,phaser,delay' +
  '&l1-gain=0.7&l2=1&l2-pitch=12&l2-detune=30&l2-decay=2' +
  '&l2-fx-filter=1&l2-fx-filter-cut=500' +
  '&l2-fx-order=delay,crush,filter,chorus,phaser,reverb';

// A fresh iframe is a fresh document load even for an identical URL, so the
// reload leg needs no cache-busting query (which the app would fold into the
// hash). The post-load settle covers boot writes + the 250ms hash debounce.
function load(src) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:420px;height:900px';
    f.addEventListener('load', () => setTimeout(() => resolve(f), 700));
    setTimeout(() => reject(new Error('iframe load timeout: ' + src)), 15000);
    f.src = src;
    document.body.appendChild(f);
  });
}

// Everything user-visible that the hash drives, in DOM order — rack order is
// observable as .fx-stage dataset keys, so a lost reorder shows up both there
// and as a permuted slider-value list.
function readState(win) {
  const d = win.document;
  return {
    scheme: d.getElementById('scheme-picker').value,
    scale: d.getElementById('scale-picker').value,
    devOpen: d.getElementById('dev-panel').open,
    fxOpen: d.getElementById('fx-panel').open,
    sbOpen: d.body.classList.contains('sb-open'),
    masterOrder: [...d.querySelectorAll('#fx-controls .fx-stage')].map((b) => b.dataset.key),
    layerOrders: [...d.querySelectorAll('#layers .layer-panel')].map((p) =>
      [...p.querySelectorAll('.fx-stage')].map((b) => b.dataset.key),
    ),
    sliders: [...d.querySelectorAll('input[type="range"]')].map((i) => i.value),
    checks: [...d.querySelectorAll('input[type="checkbox"]')].map((i) => i.checked),
    selects: [...d.querySelectorAll('select')].map((i) => i.value),
  };
}

try {
  const f1 = await load('index.html' + STATE);
  const w1 = f1.contentWindow;
  const s1 = readState(w1);
  if (!s1.scheme) fail('scheme picker empty — app did not boot');
  if (s1.scheme !== 'drift') fail('scheme: ' + s1.scheme);
  if (s1.scale !== 'insen') fail('scale: ' + s1.scale);
  if (!s1.devOpen || !s1.fxOpen) fail('panel gates dev=1/fx=1 did not open the panels');
  if (!s1.sbOpen) fail('sidebar closed despite panel gates');
  if (s1.masterOrder.join() !== 'reverb,crush,filter,chorus,phaser,delay')
    fail('master rack order: ' + s1.masterOrder.join());
  if (s1.layerOrders.length !== 3) fail('expected 3 layer racks, got ' + s1.layerOrders.length);
  if (s1.layerOrders[1].join() !== 'delay,crush,filter,chorus,phaser,reverb')
    fail('layer 2 rack order: ' + s1.layerOrders[1].join());
  const layerOn = [...w1.document.querySelectorAll('#layers .layer-panel > summary input')].map(
    (i) => i.checked,
  );
  if (layerOn.join() !== 'true,true,false') fail('layer enables: ' + layerOn.join());
  if (!s1.selects.includes('highpass')) fail('fx-filter-type=highpass not applied');
  const hash1 = w1.location.hash;
  for (const k of ['l2-pitch=12', 'l1-gain=0.7', 'fx-order=', 'l2-fx-order=', 'fx-delay-wet=0.55'])
    if (!hash1.includes(k)) fail('hash lost ' + k + ' — got ' + hash1);
  f1.remove();

  const f2 = await load('index.html' + hash1);
  const s2 = readState(f2.contentWindow);
  if (JSON.stringify(s1) !== JSON.stringify(s2))
    fail('round-trip mismatch:\nA=' + JSON.stringify(s1) + '\nB=' + JSON.stringify(s2));
  f2.remove();
} catch (e) {
  fail(String((e && e.stack) || e));
}

const verdict = out.length ? 'DOM-TEST: FAIL' : 'DOM-TEST: PASS';
document.title = verdict;
document.getElementById('out').textContent = [verdict, ...out].join('\n');
</script>
</body>
</html>
