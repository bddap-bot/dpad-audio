<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RUNNING</title>
</head>
<body>
<pre id="out"></pre>
<script type="module">
// DOM-level round-trip test for the JSON-hash scheme (dpad-audio#3): boot
// from a config exercising every kind of state, nudge the app so it rewrites
// the hash, reload from THAT hash and require identical control state; then
// check export matches the hash object, import applies a config, and the
// #dev=1 gate shorthand still opens the panels. Run via dom-test.sh
// (headless chromium); verdict is the DOM-TEST: PASS/FAIL line in the body.
const out = [];
const fail = (m) => out.push('FAIL: ' + m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const CONF = {
  scheme: 'drift',
  scale: 'insen',
  sidebar: true,
  devOpen: true,
  fxOpen: true,
  dev: { pitch: 24, crush: 0.5 },
  master: {
    order: ['reverb', 'crush', 'filter', 'chorus', 'phaser', 'ringmod', 'distort', 'delay', 'comp'],
    stages: {
      delay: { on: true, wet: 0.55, time: 0.7 },
      filter: { type: 'highpass' },
      ringmod: { on: true, wave: 'square', freq: 110 },
      distort: { on: true, drive: 0.6 },
      comp: { on: true, thresh: -30 },
    },
  },
  layers: [
    { gain: 0.7 },
    {
      on: true,
      wave: 'bell',
      pitch: 12,
      detune: 30,
      decay: 2,
      vibRate: 5,
      vibDepth: 40,
      fx: {
        order: ['delay', 'crush', 'filter', 'chorus', 'phaser', 'ringmod', 'distort', 'reverb', 'comp'],
        stages: { filter: { on: true, cut: 500 } },
      },
    },
    {},
  ],
  sliders: [{ name: 'wob', value: 0.4 }, {}, {}, {}],
  mods: {
    'l2.pitch': { src: 'lfo', wave: 'triangle', rate: 2, amount: 0.5 },
    'master.delay.time': { src: 'slider', slot: 0, offset: -0.2 },
  },
};
const STATE = '#' + encodeURIComponent(JSON.stringify(CONF));

// A fresh iframe is a fresh document load even for an identical URL. The
// post-load settle covers boot work + the 250ms hash-write debounce.
function load(src) {
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:420px;height:900px';
    f.addEventListener('load', () => setTimeout(() => resolve(f), 700));
    setTimeout(() => reject(new Error('iframe load timeout: ' + src)), 15000);
    f.src = src;
    document.body.appendChild(f);
  });
}

// Everything user-visible that the config drives, in DOM order — rack order
// is observable as .fx-stage dataset keys, so a lost reorder shows up both
// there and as a permuted slider-value list.
function readState(win) {
  const d = win.document;
  return {
    scheme: d.getElementById('scheme-picker').value,
    scale: d.getElementById('scale-picker').value,
    devOpen: d.getElementById('dev-panel').open,
    fxOpen: d.getElementById('fx-panel').open,
    sbOpen: d.body.classList.contains('sb-open'),
    masterOrder: [...d.querySelectorAll('#fx-controls .fx-stage')].map((b) => b.dataset.key),
    layerOrders: [...d.querySelectorAll('#layers .layer-panel')].map((p) =>
      [...p.querySelectorAll('.fx-stage')].map((b) => b.dataset.key),
    ),
    sliders: [...d.querySelectorAll('input[type="range"]')].map((i) => i.value),
    checks: [...d.querySelectorAll('input[type="checkbox"]')].map((i) => i.checked),
    selects: [...d.querySelectorAll('select')].map((i) => i.value),
    names: [...d.querySelectorAll('#sliders-controls input[type="text"]')].map((i) => i.value),
    mapped: [...d.querySelectorAll('.mod-btn.mapped')].map((b) => b.getAttribute('aria-label')),
  };
}

try {
  const f1 = await load('index.html' + STATE);
  const w1 = f1.contentWindow;
  const s1 = readState(w1);
  if (!s1.scheme) fail('scheme picker empty — app did not boot');
  if (s1.scheme !== 'drift') fail('scheme: ' + s1.scheme);
  if (s1.scale !== 'insen') fail('scale: ' + s1.scale);
  if (!s1.devOpen || !s1.fxOpen) fail('devOpen/fxOpen did not open the panels');
  if (!s1.sbOpen) fail('sidebar=true not applied');
  if (s1.masterOrder.join() !== CONF.master.order.join())
    fail('master rack order: ' + s1.masterOrder.join());
  if (s1.layerOrders.length !== 3) fail('expected 3 layer racks, got ' + s1.layerOrders.length);
  if (s1.layerOrders[1].join() !== CONF.layers[1].fx.order.join())
    fail('layer 2 rack order: ' + s1.layerOrders[1].join());
  const layerOn = [...w1.document.querySelectorAll('#layers .layer-panel > summary input')].map(
    (i) => i.checked,
  );
  if (layerOn.join() !== 'true,true,false') fail('layer enables: ' + layerOn.join());
  if (!s1.selects.includes('highpass')) fail('filter type=highpass not applied');
  if (!s1.selects.includes('bell')) fail('layer 2 wave=bell not applied');
  // 20 wave types on the layer wave picker AND the ring-mod wave picker.
  const waveSel = w1.document.querySelector('#layers .layer-panel select');
  if (waveSel.options.length !== 20) fail('layer wave picker has ' + waveSel.options.length + ' options');
  const rmSel = [...w1.document.querySelectorAll('#fx-controls .fx-stage')]
    .find((b) => b.dataset.key === 'ringmod')
    .querySelector('select');
  if (rmSel.options.length !== 20) fail('ring-mod wave picker has ' + rmSel.options.length + ' options');
  if (rmSel.value !== 'square') fail('ring-mod wave=square not applied: ' + rmSel.value);

  // Mod mappings (dpad-audio#4): the custom-slider panel sits at the top of
  // the sidebar, names round-trip, and mapped sliders show the filled icon.
  const firstPanel = w1.document.querySelector('#sidebar > details');
  if (firstPanel.id !== 'sliders-panel') fail('custom sliders not at sidebar top: ' + firstPanel.id);
  if (s1.names.length !== 4) fail('expected 4 custom sliders, got ' + s1.names.length);
  if (s1.names[0] !== 'wob') fail('custom slider name lost: ' + JSON.stringify(s1.names));
  if (s1.mapped.length !== 2) fail('expected 2 mapped sliders, got ' + JSON.stringify(s1.mapped));
  if (!s1.mapped.some((l) => l.includes('l2.pitch')) || !s1.mapped.some((l) => l.includes('master.delay.time')))
    fail('wrong sliders mapped: ' + JSON.stringify(s1.mapped));
  // The mapping menu opens from the icon and shows the LFO's controls.
  const l2pitchBtn = [...w1.document.querySelectorAll('.mod-btn')].find(
    (b) => b.getAttribute('aria-label') === 'mod mapping: l2.pitch',
  );
  l2pitchBtn.click();
  const menu = w1.document.getElementById('mod-menu');
  if (menu.hidden) fail('mod menu did not open');
  const menuSelects = [...menu.querySelectorAll('select')].map((s) => s.value);
  if (!menuSelects.includes('lfo')) fail('mod menu source select not on lfo: ' + menuSelects.join());
  if (!menuSelects.includes('triangle')) fail('mod menu wave select not on triangle: ' + menuSelects.join());
  l2pitchBtn.click();
  if (!menu.hidden || menu.childElementCount) fail('mod menu did not close/empty on re-click');

  // Nudge a control twice (net no-op) so the app WRITES the hash, then check
  // the written JSON still carries the state.
  const nudge = w1.document.querySelector('#fx-controls .fx-stage input[type="checkbox"]');
  nudge.click();
  nudge.click();
  await wait(600);
  const hash1 = w1.location.hash;
  let enc;
  try {
    enc = JSON.parse(decodeURIComponent(hash1.slice(1)));
  } catch (e) {
    fail('app-written hash is not URL-encoded JSON: ' + hash1);
  }
  if (enc) {
    if (enc.layers?.[1]?.pitch !== 12) fail('encoded hash lost layers[1].pitch');
    if (enc.layers?.[0]?.gain !== 0.7) fail('encoded hash lost layers[0].gain');
    if (enc.master?.stages?.delay?.wet !== 0.55) fail('encoded hash lost delay wet');
    if (enc.master?.order?.join() !== CONF.master.order.join()) fail('encoded hash lost master order');
    if (enc.layers?.[1]?.fx?.order?.join() !== CONF.layers[1].fx.order.join())
      fail('encoded hash lost layer 2 order');
    if (enc.mods?.['l2.pitch']?.wave !== 'triangle') fail('encoded hash lost the l2.pitch mapping');
    if (enc.mods?.['master.delay.time']?.offset !== -0.2) fail('encoded hash lost the delay-time mapping');
    if (enc.sliders?.[0]?.name !== 'wob') fail('encoded hash lost the custom slider name');
  }

  // Export must produce the SAME object the hash carries.
  w1.document.getElementById('cfg-export').click();
  const exported = w1.document.getElementById('cfg-text').value;
  if (enc && JSON.stringify(JSON.parse(exported)) !== JSON.stringify(enc))
    fail('export differs from hash:\nexport=' + exported + '\nhash=' + JSON.stringify(enc));

  // Reload from the app-written hash: state must be identical.
  const f2 = await load('index.html' + hash1);
  const s2 = readState(f2.contentWindow);
  if (JSON.stringify(s1) !== JSON.stringify(s2))
    fail('round-trip mismatch:\nA=' + JSON.stringify(s1) + '\nB=' + JSON.stringify(s2));
  f2.remove();

  // Import refuses a typo'd key loudly instead of silently dropping it.
  w1.document.getElementById('cfg-text').value = JSON.stringify({ scheme: 'fixed', vibrate: 9 });
  w1.document.getElementById('cfg-import').click();
  const rejMsg = w1.document.getElementById('cfg-msg').textContent;
  if (!rejMsg.includes('unknown keys: vibrate')) fail('typo import not refused: "' + rejMsg + '"');

  // Import applies a pasted config (replace semantics) via reload.
  w1.document.getElementById('cfg-text').value = JSON.stringify({ scheme: 'fixed', devOpen: true });
  const reloaded = new Promise((res, rej) => {
    f1.addEventListener('load', () => setTimeout(res, 700), { once: true });
    setTimeout(() => rej(new Error('import never reloaded')), 10000);
  });
  w1.document.getElementById('cfg-import').click();
  await reloaded;
  const w1b = f1.contentWindow;
  if (w1b.document.getElementById('scheme-picker').value !== 'fixed')
    fail('import did not apply scheme=fixed');
  if (!w1b.document.getElementById('dev-panel').open) fail('import did not apply devOpen');
  // JSON path has NO open-panel⇒sidebar inference (it would break round-trip
  // identity for {panel open, sidebar closed}); only the #dev=1 shorthand infers.
  if (w1b.document.body.classList.contains('sb-open'))
    fail('JSON config without sidebar:true opened the sidebar (inference leak)');
  if (w1b.document.getElementById('scale-picker').value !== 'hirajoshi')
    fail('import is a patch, not a replace — scale should be back at default');
  f1.remove();

  // The hand-typed gate shorthand still works.
  const f3 = await load('index.html#dev=1&fx=1');
  const s3 = readState(f3.contentWindow);
  if (!s3.devOpen || !s3.fxOpen || !s3.sbOpen) fail('#dev=1&fx=1 shorthand broken: ' + JSON.stringify(s3));
  f3.remove();
} catch (e) {
  fail(String((e && e.stack) || e));
}

const verdict = out.length ? 'DOM-TEST: FAIL' : 'DOM-TEST: PASS';
document.title = verdict;
document.getElementById('out').textContent = [verdict, ...out].join('\n');
</script>
</body>
</html>
