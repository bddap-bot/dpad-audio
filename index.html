<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>d-pad audio playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>d-pad audio</h1>
    <div class="pickers">
      <label>scheme
        <select id="scheme-picker"></select>
      </label>
      <label>scale
        <select id="scale-picker"></select>
      </label>
    </div>
  </header>

  <div id="path" aria-label="path so far"></div>

  <div id="dpad">
    <button class="key" id="key-up"    data-dir="U" aria-label="up">▲</button>
    <button class="key" id="key-left"  data-dir="L" aria-label="left">◀</button>
    <button class="key" id="key-right" data-dir="R" aria-label="right">▶</button>
    <button class="key" id="key-down"  data-dir="D" aria-label="down">▼</button>
    <button id="clear" aria-label="clear path">✕</button>
  </div>

  <div id="cadence" hidden>
    <button id="accept" aria-label="accept cadence">✓ accept</button>
    <button id="reject" aria-label="reject cadence">✗ reject</button>
  </div>

  <footer>arrow keys work too · enter ✓ / backspace ✗ · path auto-clears after a pause</footer>
</main>

<button id="sidebar-toggle" aria-label="toggle controls sidebar" aria-expanded="false">🎛</button>
<aside id="sidebar" aria-label="controls">
  <details id="dev-panel">
    <summary>dev mode — free play</summary>
    <div id="dev-controls"></div>
    <button id="pluck">pluck</button>
  </details>

  <div id="layers"></div>

  <details id="fx-panel">
    <summary>master post-fx — pick by ear</summary>
    <div id="fx-controls"></div>
  </details>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
