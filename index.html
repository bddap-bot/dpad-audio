<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<title>d-pad audio playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>d-pad audio</h1>
    <div class="pickers">
      <label>scheme
        <select id="scheme-picker"></select>
      </label>
      <label>scale
        <select id="scale-picker"></select>
      </label>
    </div>
  </header>

  <div id="path" aria-label="path so far"></div>

  <div id="dpad">
    <button class="key" id="key-up"    data-dir="U" aria-label="up">▲</button>
    <button class="key" id="key-left"  data-dir="L" aria-label="left">◀</button>
    <button class="key" id="key-right" data-dir="R" aria-label="right">▶</button>
    <button class="key" id="key-down"  data-dir="D" aria-label="down">▼</button>
    <button id="clear" aria-label="clear path">✕</button>
  </div>

  <footer>arrow keys work too · path auto-clears after a pause</footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
